version: "3.9"

services:
  postgres:
    image: ankane/pgvector:pg16
    container_name: healix_postgres
    environment:
      POSTGRES_USER: healix
      POSTGRES_PASSWORD: healix
      POSTGRES_DB: healix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
